<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pause</title>
<style>
  :root {
    --bg: #fdf6e3; --fg: #5c6a72; --dim: #939f91; --green: #8da101; --red: #f85552; --yellow: #dfa000; --line: #e6e2cc;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #2d353b; --fg: #d3c6aa; --dim: #859289; --green: #a7c080; --red: #e67e80; --yellow: #dbbc7f; --line: #3d484d; }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    min-height: 100dvh; padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; max-width: 560px; margin: 0 auto;
  }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
  .sub { color: var(--dim); font-size: 14px; margin-bottom: 20px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--green); margin: 18px 0 6px; }
  ul { list-style: none; padding: 0; }
  li { display: flex; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  li .when { flex: 0 0 64px; color: var(--dim); font-variant-numeric: tabular-nums; }
  li.late .when { color: var(--red); font-weight: 600; }
  li.soon .when { color: var(--yellow); font-weight: 600; }
  .study { display: flex; gap: 16px; }
  .study span { color: var(--red); }
  .study span.ok { color: var(--green); }
  .empty { color: var(--dim); }
  .foot { margin-top: auto; padding-top: 28px; }
  .count { font-size: 56px; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; color: var(--dim); }
  a.go {
    display: block; text-align: center; padding: 16px; border-radius: 12px; font-weight: 600; text-decoration: none;
    background: var(--line); color: var(--dim); pointer-events: none;
  }
  a.go.ready { background: var(--green); color: var(--bg); pointer-events: auto; }
  .hint { color: var(--dim); font-size: 13px; text-align: center; margin-top: 10px; }
</style>
</head>
<body>
  <h1 id="title">Before you scroll</h1>
  <p class="sub" id="sub"></p>

  <h2>Study</h2>
  <div class="study" id="study"></div>

  <h2>Reminders</h2>
  <ul id="list"></ul>

  <div class="foot">
    <div class="count" id="count">10</div>
    <a class="go" id="go" href="#">Wait</a>
    <p class="hint" id="hint">The countdown pauses if you leave this page.</p>
  </div>

<script>
(function () {
  var APPS = { 'instagram://': 'Instagram', 'fb://': 'Facebook', 'twitter://': 'X', 'reddit://': 'Reddit' };
  var WEEK = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  var params = {};
  location.hash.replace(/^#/, '').split('&').forEach(function (kv) {
    var i = kv.indexOf('=');
    if (i > 0) { try { params[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1)); } catch (e) {} }
  });
  // Accept the app link and the reminders in either slot, so a swapped
  // variable in the Shortcut still works.
  var app = '', data = null;
  [params.a, params.d].forEach(function (v) {
    if (!v) return;
    try { var j = JSON.parse(v); if (j && j.r) { data = j; return; } } catch (e) {}
    if (/^[a-z]+:\/\//i.test(v)) app = v.toLowerCase();
  });
  var appName = APPS[app] || 'the app';

  // Day numbers in the phone's local time, so "today" matches the clock.
  function dayNum(iso) { var p = iso.split('-'); return Math.floor(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 864e5); }
  var now = new Date();
  var today = Math.floor(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) / 864e5);
  function when(d) {
    var k = d - today;
    if (k < 0) return -k + 'd late';
    if (k === 0) return 'today';
    if (k === 1) return 'tmrw';
    if (k < 7) return WEEK[new Date(d * 864e5).getUTCDay()];
    return k + 'd';
  }

  document.getElementById('title').textContent = 'Before ' + appName;
  var list = document.getElementById('list');
  var study = document.getElementById('study');
  var sub = document.getElementById('sub');

  if (!data) {
    var got = params.d || '';
    sub.textContent = 'No reminders came through. Check the Gate shortcut. Received: ' + (got ? '"' + got.slice(0, 80) + (got.length > 80 ? '…' : '') + '"' : 'nothing after &d=');
  } else {
    var t = dayNum(data.t);
    sub.textContent = t === today ? 'Synced from your Mac today.' : 'Last synced from your Mac ' + (today - t) + 'd ago.';
    var rows = (data.r || []).map(function (r) { return { label: r[0], day: r[1] ? dayNum(r[1]) : null, kind: r[2] }; });
    rows.sort(function (x, y) {
      if (x.day === null && y.day === null) return 0;
      if (x.day === null) return 1;
      if (y.day === null) return -1;
      return x.day - y.day;
    });
    rows.forEach(function (r) {
      var li = document.createElement('li');
      var w = document.createElement('span'); w.className = 'when';
      var l = document.createElement('span');
      l.textContent = r.label;
      if (r.day !== null) {
        w.textContent = when(r.day);
        if (r.day < today || r.kind === 'late') li.className = 'late';
        else if (r.day - today <= 1) li.className = 'soon';
      }
      li.append(w, l);
      list.append(li);
    });
    if (!rows.length) list.innerHTML = '<li class="empty">Nothing on the list.</li>';
    var fresh = t === today;
    [['Lesson', fresh && data.s && data.s[0]], ['NeetCode', fresh && data.s && data.s[1]]].forEach(function (s) {
      var el = document.createElement('div');
      el.innerHTML = s[0] + ': ';
      var v = document.createElement('span');
      v.textContent = s[1] ? 'done' : 'not done';
      if (s[1]) v.className = 'ok';
      el.append(v);
      study.append(el);
    });
  }

  // 10-second countdown that only runs while the page is on screen.
  var left = 10;
  var count = document.getElementById('count');
  var go = document.getElementById('go');
  var timer = null;
  function finish() {
    count.textContent = '0';
    go.textContent = 'Open ' + appName;
    go.classList.add('ready');
    go.href = app
      ? 'shortcuts://run-shortcut?name=' + encodeURIComponent('Gate Pass') + '&input=text&text=' + encodeURIComponent(app)
      : '#';
    document.getElementById('hint').textContent = 'Or put the phone down.';
  }
  function step() {
    left -= 1;
    count.textContent = String(left);
    if (left <= 0) { clearInterval(timer); timer = null; finish(); }
  }
  function start() { if (!timer && left > 0) timer = setInterval(step, 1000); }
  function stop() { if (timer) { clearInterval(timer); timer = null; } }
  document.addEventListener('visibilitychange', function () { document.hidden ? stop() : start(); });
  if (!document.hidden) start();
})();
</script>
</body>
</html>
