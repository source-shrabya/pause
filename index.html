<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141518" media="(prefers-color-scheme: dark)">
<title>Pause</title>
<style>
  :root {
    --bg: #f4f1ea; --ink: #1c1b19; --dim: #7a766d; --faint: #a9a398; --line: #e1dcd0; --card: #fbf9f4;
    --late: #b42318; --today: #9a5b00; --ok: #2f7a4a; --btn: #1c1b19; --btn-ink: #f4f1ea; --track: #dcd6c9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141518; --ink: #ece8df; --dim: #8e8a82; --faint: #5f5c57; --line: #26282d; --card: #1b1d21;
      --late: #ff7a6b; --today: #f2b04a; --ok: #6fcf8f; --btn: #ece8df; --btn-ink: #141518; --track: #2c2e33;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg); }
  body {
    background: var(--bg); color: var(--ink);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
    max-width: 520px; margin: 0 auto; min-height: 100dvh;
    padding: max(28px, env(safe-area-inset-top)) 20px 0;
  }

  .meta { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--dim); }
  .meta .stale { color: var(--late); }
  h1 {
    font-family: ui-serif, "New York", Georgia, serif; font-weight: 600;
    font-size: 34px; line-height: 1.1; letter-spacing: -0.01em; margin: 18px 0 8px;
  }
  .summary { font-size: 17px; color: var(--dim); }
  .summary b { font-weight: 600; color: var(--ink); }

  .study { display: flex; gap: 8px; margin: 22px 0 6px; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px 7px 10px;
    border: 1px solid var(--line); border-radius: 999px; font-size: 14px; color: var(--dim); background: var(--card);
  }
  .chip i { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--faint); flex: none; }
  .chip.done { color: var(--ink); }
  .chip.done i { border-color: var(--ok); background: var(--ok); box-shadow: inset 0 0 0 2.5px var(--card); }

  section { margin-top: 22px; }
  h2 { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin-bottom: 2px; }
  h2.late { color: var(--late); }
  h2.today { color: var(--today); }
  ul { list-style: none; }
  li { display: flex; align-items: baseline; gap: 14px; padding: 11px 0; border-bottom: 1px solid var(--line); }
  li:last-child { border-bottom: 0; }
  li .label { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  li .when { flex: none; font-size: 14px; color: var(--dim); font-variant-numeric: tabular-nums; }
  li.late .when { color: var(--late); font-weight: 600; }
  li .tag { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--faint); margin-left: 6px; }

  .note { margin-top: 22px; font-size: 14px; color: var(--dim); }
  details { margin-top: 10px; font-size: 12px; color: var(--faint); }
  details p { margin-top: 6px; overflow-wrap: anywhere; font-family: ui-monospace, Menlo, monospace; }

  .spacer { height: 170px; }
  .dock {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 28px 20px max(20px, env(safe-area-inset-bottom));
    background: linear-gradient(to bottom, transparent, var(--bg) 26px);
  }
  .dock > * { max-width: 480px; margin-left: auto; margin-right: auto; }
  .go {
    position: relative; overflow: hidden; display: block; width: 100%;
    padding: 17px 16px; border-radius: 14px; text-align: center; text-decoration: none;
    font-size: 17px; font-weight: 600; background: var(--track); color: var(--dim);
    pointer-events: none; -webkit-tap-highlight-color: transparent;
  }
  .go .fill { position: absolute; top: 0; bottom: 0; left: 0; width: 0; background: var(--faint); opacity: .35; }
  .go span { position: relative; }
  .go.ready { background: var(--btn); color: var(--btn-ink); pointer-events: auto; }
  .go.ready .fill { display: none; }
  .row { display: flex; gap: 8px; }
  .row .go { padding: 15px 8px; font-size: 15px; }
  .hint { margin-top: 12px; text-align: center; font-size: 13px; color: var(--faint); }
</style>
</head>
<body>
  <div class="meta"><span id="date"></span><span id="sync"></span></div>
  <h1 id="title">Before you scroll</h1>
  <p class="summary" id="summary"></p>
  <div class="study" id="study"></div>
  <div id="lists"></div>
  <div class="spacer"></div>

  <div class="dock">
    <div id="buttons"></div>
    <p class="hint" id="hint">The timer stops while you're away from this page.</p>
  </div>

<script>
(function () {
  var APPS = { 'instagram://': 'Instagram', 'fb://': 'Facebook', 'tiktok://': 'TikTok', 'twitter://': 'X', 'reddit://': 'Reddit' };
  var WAIT = 10;
  var WEEK = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var $ = function (id) { return document.getElementById(id); };
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  // ---- read the link: #a=<app scheme>&d=<reminders>[&v=2] -----------------
  var raw = location.hash.slice(1), params = {};
  raw.split('&').forEach(function (kv) {
    var i = kv.indexOf('=');
    if (i > 0) params[kv.slice(0, i)] = kv.slice(i + 1);
  });
  function undo(v) { // undo any layers of percent-encoding the Shortcut added
    for (var k = 0; k < 4; k++) { var n = v; try { n = decodeURIComponent(v); } catch (e) {} if (n === v) break; v = n; }
    return v;
  }

  // Current format: base64url of "YYYY-MM-DD lesson neet", then one
  // "kind<TAB>due<TAB>label" line per reminder, then "end".
  function fromB64(v) {
    v = v.replace(/[^A-Za-z0-9_-]/g, '');
    if (v.length % 4 === 1) v = v.slice(0, -1);
    var bin;
    try { bin = atob(v.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((v.length + 3) % 4)); } catch (e) { return null; }
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var lines = new TextDecoder('utf-8').decode(bytes).split('\n');
    var head = /^(\d{4}-\d{2}-\d{2}) ([01]) ([01])$/.exec(lines[0]);
    if (!head) return null;
    var whole = lines[lines.length - 1] === 'end';
    // Drop the "end" line, or on a cut link the half-arrived last row.
    var kinds = { t: 'todo', b: 'bill', l: 'late' };
    return {
      t: head[1], s: [+head[2], +head[3]], cut: !whole,
      r: lines.slice(1, -1).map(function (l) {
        var p = l.split('\t');
        return p.length < 3 ? null : [p.slice(2).join(' '), p[1], kinds[p[0]] || 'todo'];
      }).filter(Boolean)
    };
  }
  // Old format: percent-encoded JSON {t, r: [[label, due, kind]], s}.
  function fromJSON(v) {
    var a0 = v.indexOf('{'), a1 = v.lastIndexOf('}');
    if (a0 < 0 || a1 <= a0) return null;
    try { var j = JSON.parse(v.slice(a0, a1 + 1)); return j && j.r ? j : null; } catch (e) { return null; }
  }

  var app = '', data = null;
  [params.a, params.d].forEach(function (v) {
    if (!v) return;
    v = undo(v);
    if (/^[a-z]+:\/\//i.test(v)) { app = v.toLowerCase(); return; }
    data = data || fromJSON(v) || fromB64(v);
  });
  var appName = APPS[app] || '';
  var direct = params.v === '2'; // new Gate shortcut: open the app straight from here

  // ---- dates, in the phone's local time ------------------------------------
  function dayNum(iso) { var p = iso.split('-'); return Math.floor(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 864e5); }
  var now = new Date();
  var today = Math.floor(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) / 864e5);
  function when(d) {
    var k = d - today, dt = new Date(d * 864e5);
    if (k < 0) return -k === 1 ? 'yesterday' : -k + ' days ago';
    if (k === 1) return 'tomorrow';
    if (k < 7) return WEEK[dt.getUTCDay()];
    return MON[dt.getUTCMonth()] + ' ' + dt.getUTCDate();
  }

  $('date').textContent = WEEK[now.getDay()] + ', ' + MON[now.getMonth()] + ' ' + now.getDate();
  $('title').textContent = appName ? 'Before ' + appName : 'Before you scroll';

  // ---- render --------------------------------------------------------------
  if (!data) {
    $('summary').textContent = "Your reminders didn't come through this time.";
    var d = el('details');
    d.append(el('summary', null, 'Link details'),
      el('p', null, raw.length + ' chars: ' + (raw.slice(0, 80) || '(empty)') + (raw.length > 80 ? ' … ' + raw.slice(-60) : '')));
    $('lists').append(d);
  } else {
    var t = dayNum(data.t), fresh = t === today;
    var sync = $('sync');
    sync.textContent = fresh ? 'Synced today' : 'List is ' + (today - t) + (today - t === 1 ? ' day' : ' days') + ' old';
    if (!fresh) sync.className = 'stale';

    var groups = { late: [], today: [], week: [], later: [], none: [] };
    (data.r || []).forEach(function (r) {
      var row = { label: r[0], day: r[1] ? dayNum(r[1]) : null, kind: r[2] };
      var g = row.day === null ? 'none'
        : row.day < today || row.kind === 'late' ? 'late'
        : row.day === today ? 'today'
        : row.day - today < 7 ? 'week' : 'later';
      groups[g].push(row);
    });
    Object.keys(groups).forEach(function (g) { groups[g].sort(function (x, y) { return (x.day || 0) - (y.day || 0); }); });

    var nl = groups.late.length, nt = groups.today.length, bits = [];
    if (nl) bits.push('<b>' + nl + ' overdue</b>');
    if (nt) bits.push('<b>' + nt + ' due today</b>');
    $('summary').innerHTML = bits.length ? bits.join(' and ') + '.' : 'Nothing due today.';

    var study = $('study');
    [['Lesson', fresh && data.s && data.s[0]], ['NeetCode', fresh && data.s && data.s[1]]].forEach(function (s) {
      var c = el('span', 'chip' + (s[1] ? ' done' : ''));
      c.append(el('i'), document.createTextNode(s[0] + (s[1] ? ' done' : ' not done')));
      study.append(c);
    });

    [['late', 'Overdue'], ['today', 'Today'], ['week', 'This week'], ['later', 'Later'], ['none', 'Anytime']].forEach(function (g) {
      var rows = groups[g[0]];
      if (!rows.length) return;
      var sec = el('section'), ul = el('ul');
      sec.append(el('h2', g[0] === 'late' || g[0] === 'today' ? g[0] : null, g[1]), ul);
      rows.forEach(function (r) {
        var li = el('li', g[0] === 'late' ? 'late' : null), lab = el('span', 'label', r.label);
        if (r.kind === 'bill') lab.append(el('span', 'tag', 'bill'));
        li.append(lab);
        if (r.day !== null && g[0] !== 'today') li.append(el('span', 'when', when(r.day)));
        ul.append(li);
      });
      $('lists').append(sec);
    });
    if (!data.r || !data.r.length) $('lists').append(el('p', 'note', 'Nothing on the list.'));
    if (data.cut) $('lists').append(el('p', 'note', 'The list got cut short on the way here, so some reminders may be missing.'));
  }

  // ---- the button ----------------------------------------------------------
  function target(scheme) {
    return direct ? scheme
      : 'shortcuts://run-shortcut?name=' + encodeURIComponent('Gate Pass') + '&input=text&text=' + encodeURIComponent(scheme);
  }
  var choices = app ? [[app, appName || 'the app']] : [['instagram://', 'Instagram'], ['fb://', 'Facebook'], ['tiktok://', 'TikTok']];
  var box = $('buttons'), btns = [];
  if (choices.length > 1) box.className = 'row';
  choices.forEach(function (c) {
    var a = el('a', 'go'), fill = el('span', 'fill'), txt = el('span');
    a.href = '#'; a.append(fill, txt);
    box.append(a);
    btns.push({ a: a, fill: fill, txt: txt, scheme: c[0], name: c[1] });
  });

  // The timer only runs while this page is on screen.
  var spent = 0, last = null, timer = null;
  function paint() {
    var left = Math.max(0, Math.ceil(WAIT - spent));
    btns.forEach(function (b) {
      b.fill.style.width = Math.min(100, spent / WAIT * 100) + '%';
      b.txt.textContent = choices.length > 1 ? b.name + (left ? ' · ' + left : '') : 'Open ' + b.name + (left ? ' in ' + left : '');
      if (!left) { b.a.classList.add('ready'); b.a.href = target(b.scheme); }
    });
    if (!left) $('hint').textContent = 'Or put the phone down.';
  }
  function tick() {
    var t = performance.now();
    if (last !== null) spent += (t - last) / 1000;
    last = t;
    paint();
    if (spent >= WAIT) stop();
  }
  function start() { if (!timer && spent < WAIT) { last = performance.now(); timer = setInterval(tick, 100); } }
  function stop() { if (timer) { clearInterval(timer); timer = null; } last = null; }
  document.addEventListener('visibilitychange', function () { document.hidden ? stop() : start(); });
  paint();
  if (!document.hidden) start();
})();
</script>
</body>
</html>
